<div class="onnx-panel">
  <style>
    .onnx-panel {
      width: 100%; height: 100%;
      background: rgba(10, 12, 16, 0.72);
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      display: flex; flex-direction: column; gap: 6px;
      font-family: "Roboto", sans-serif;
      color: #e8e8e8;
    }
    .onnx-panel .onnx-status {
      font-size: 11px; line-height: 14px; min-height: 14px;
      text-align: center; opacity: 0.9;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .onnx-panel button {
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.10);
      color: #e8e8e8;
      font-size: 13px; font-weight: 600;
      padding: 8px 4px;
      cursor: pointer;
      outline: none;
    }
    .onnx-panel button:hover { background: rgba(255, 255, 255, 0.22); }
    .onnx-panel button:active { background: rgba(255, 255, 255, 0.32); }
    .onnx-panel .onnx-engage { padding: 12px 4px; font-size: 15px; }
    .onnx-panel .onnx-engage.on  { background: rgba(190, 60, 50, 0.75); }
    .onnx-panel .onnx-engage.off { background: rgba(40, 150, 90, 0.75); }
    .onnx-panel .onnx-row { display: flex; gap: 6px; }
  </style>

  <div class="onnx-status">{{ status }}</div>

  <div class="onnx-row">
    <button class="onnx-engage" ng-class="engaged ? 'on' : 'off'"
            ng-click="send('engage')">
      {{ engaged ? 'DISENGAGE' : 'ENGAGE' }}
    </button>
  </div>

  <div class="onnx-row">
    <button ng-mousedown="desireDown('lane_l')" ng-mouseup="desireUp()"
            ng-mouseleave="desireUp()">&#9664; LANE</button>
    <button ng-mousedown="desireDown('lane_r')" ng-mouseup="desireUp()"
            ng-mouseleave="desireUp()">LANE &#9654;</button>
  </div>

  <div class="onnx-row">
    <button ng-mousedown="desireDown('turn_l')" ng-mouseup="desireUp()"
            ng-mouseleave="desireUp()">&#9664; TURN</button>
    <button ng-mousedown="desireDown('turn_r')" ng-mouseup="desireUp()"
            ng-mouseleave="desireUp()">TURN &#9654;</button>
  </div>

  <div class="onnx-row">
    <button ng-click="send('long')">LONG: {{ longMode }}</button>
    <button ng-click="send('cal')">CAL</button>
  </div>

  <div class="onnx-row">
    <button ng-click="send('spd_dn')">SPD &minus;</button>
    <button ng-click="send('spd_up')">SPD +</button>
  </div>
</div>
